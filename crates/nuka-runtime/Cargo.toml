[package]
name = "nuka-runtime"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
anyhow = "1"
nuka-domain = { path = "../nuka-domain" }
nuka-integrations = { path = "../nuka-integrations" }
nuka-knowledge = { path = "../nuka-knowledge" }
nuka-storage = { path = "../nuka-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
