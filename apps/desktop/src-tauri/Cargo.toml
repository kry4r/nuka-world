[package]
name = "desktop-tauri"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "desktop_tauri"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
anyhow = "1"
async-trait = "0.1"
aes-gcm-siv = "0.12.0-rc.3"
getrandom = "0.3.4"
nuka-domain = { path = "../../../crates/nuka-domain" }
nuka-integrations = { path = "../../../crates/nuka-integrations" }
nuka-knowledge = { path = "../../../crates/nuka-knowledge" }
nuka-memory = { path = "../../../crates/nuka-memory" }
nuka-runtime = { path = "../../../crates/nuka-runtime" }
nuka-storage = { path = "../../../crates/nuka-storage" }
nuka-tools = { path = "../../../crates/nuka-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-mcp-bridge = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
